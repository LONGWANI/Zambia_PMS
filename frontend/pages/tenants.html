<div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-sm-items-center gap-3 mb-4">
    <div>
        <h2 class="fs-4 fw-bold mb-1" style="color: var(--text-primary);">Tenant Directory</h2>
        <p class="text-muted small mb-0" id="tenantSubtext">Direct operational overview of active contracts and commercial lease pipelines</p>
    </div>
    <button class="btn-primary" onclick="openOnboardTenantModal()">
        <i class="bi bi-person-plus me-2"></i> Onboard New Tenant
    </button>
</div>

<div class="saas-card p-0 overflow-hidden">
    <div class="p-3 border-bottom d-flex flex-column flex-sm-row justify-content-between align-items-stretch align-sm-items-center gap-3 bg-light">
        <div class="input-group" style="max-width: 400px;">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control border-start-0" placeholder="Search legal identity, email, or unit room..." id="tenantSearch">
        </div>
        <div>
            <select class="form-select" id=\"tenantStatusFilter\" style=\"width: auto;\">
                <option value="all">All Accounting States</option>
                <option value="active">Active Accounts</option>
                <option value="arrears">Accounts in Arrears (Deficits)</option>
            </select>
        </div>
    </div>

    <div class="table-responsive">
        <table class="saas-table">
            <thead>
                <tr>
                    <th>Legal Identity Name</th>
                    <th>Assigned Space Unit</th>
                    <th>Communications Point</th>
                    <th>Lease Lifecycle Status</th>
                    <th>Ledger Net Balance</th>
                    <th class="text-end">System Action Controls</th>
                </tr>
            </thead>
            <tbody id="tenantTableBody">
                <tr>
                    <td colspan="6" class="text-center py-5 text-muted">
                        <div class="spinner-border spinner-border-sm text-secondary me-2"></div>
                        Accessing database directory records...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
