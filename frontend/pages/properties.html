<div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-sm-items-center gap-3 mb-4">
    <div>
        <h2 class="fs-4 fw-bold mb-1" style="color: var(--text-primary);">Property Portfolio</h2>
        <p class="text-muted small mb-0" id="propertySubtext">Track structural layout models, physical complexes, and individual units</p>
    </div>
    <button class="btn-primary" onclick=\"openCreatePropertyModal()\">
        <i class="bi bi-plus-lg me-2"></i> Add Asset Property
    </button>
</div>

<div class="saas-card p-0 overflow-hidden">
    <div class="p-3 border-bottom d-flex flex-column flex-md-row gap-3 bg-light">
        <div class="input-group" style="max-width: 400px;">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control border-start-0" placeholder="Search by property name or city..." id="propertySearch">
        </div>
        <div class="d-flex gap-2">
            <select class="form-select" id="propertyTypeFilter" style="width: auto; min-width: 160px;">
                <option value="all">All Real Estate Types</option>
                <option value="residential">Residential Units</option>
                <option value="commercial">Commercial Sites</option>
            </select>
            <button class="btn btn-white border d-flex align-items-center gap-2 text-secondary fw-medium bg-white">
                <i class="bi bi-sliders"></i> Advanced Filter
            </button>
        </div>
    </div>

    <div class="table-responsive">
        <table class="saas-table">
            <thead>
                <tr>
                    <th>Property Name Asset</th>
                    <th>Location Province</th>
                    <th>Configured Units</th>
                    <th>Occupancy Profile</th>
                    <th>Operational Status</th>
                    <th class="text-end">Management Actions</th>
                </tr>
            </thead>
            <tbody id="propertyTableBody">
                <tr>
                    <td colspan="6" class="text-center py-5 text-muted">
                        <div class="spinner-border spinner-border-sm text-secondary me-2"></div>
                        Fetching asset registrations...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
