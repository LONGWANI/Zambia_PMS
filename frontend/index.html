<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZambiaPMS — Property Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="app-shell">

    <!-- ── SIDEBAR ── -->
    <aside class="app-sidebar" aria-label="Main Navigation">
        <div class="sidebar-brand">
            <div class="brand-logo">
                <i class="bi bi-building-fill-gear"></i>
            </div>
            <div class="brand-text">
                <h2>ZambiaPMS</h2>
                <span>Enterprise Hub</span>
            </div>
        </div>

        <nav class="sidebar-menu">
            <a href="pages/dashboard.html" class="menu-item active" data-view="dashboard">
                <i class="bi bi-grid-1x2-fill"></i>
                <span>Dashboard</span>
            </a>
            <a href="pages/properties.html" class="menu-item" data-view="properties">
                <i class="bi bi-building"></i>
                <span>Properties</span>
            </a>
            <a href="pages/tenants.html" class="menu-item" data-view="tenants">
                <i class="bi bi-people-fill"></i>
                <span>Tenants</span>
            </a>
            <a href="pages/payments.html" class="menu-item" data-view="payments">
                <i class="bi bi-cash-stack"></i>
                <span>Financial Ledger</span>
            </a>
            <a href="pages/maintenance.html" class="menu-item" data-view="maintenance">
                <i class="bi bi-tools"></i>
                <span>Maintenance</span>
                <span class="badge-count warning">3</span>
            </a>
            <a href="pages/reports.html" class="menu-item" data-view="reports">
                <i class="bi bi-pie-chart-fill"></i>
                <span>Analytics</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <button id="logoutBtn" class="btn-action-logout">
                <i class="bi bi-box-arrow-left"></i>
                <span>Sign Out</span>
            </button>
        </div>
    </aside>

    <!-- ── MAIN VIEWPORT ── -->
    <div class="main-viewport">

        <!-- Topbar -->
        <header class="app-topbar">
            <div class="topbar-context">
                <h1 id="pageWorkspaceTitle">Dashboard</h1>
                <p class="text-subtle" id="pageWorkspaceSubtitle">Real-time portfolio overview</p>
            </div>

            <div class="topbar-actions">
                <button class="btn-icon-interactive" aria-label="Notifications" id="notificationBell">
                    <i class="bi bi-bell"></i>
                    <span class="indicator-pulse"></span>
                </button>

                <div class="vertical-divider"></div>

                <div class="user-identity-card">
                    <div class="user-avatar">JM</div>
                    <div class="user-meta">
                        <span class="user-name" id="sessionUserName">James Mwale</span>
                        <span class="user-role">Administrator</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Workspace -->
        <main class="workspace-content" id="contentWorkspace">
            <div class="workspace-loader">
                <div class="spinner-core"></div>
                <p>Loading workspace...</p>
            </div>
        </main>

    </div>
</div>

<div id="toastNotificationStack" class="toast-stack-container" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
