<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZambiaPMS — Property Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --sidebar-bg: #0f172a;
  --sidebar-w: 240px;
  --accent: #0d9488;
  --accent-dark: #0f766e;
  --accent-light: #ccfbf1;
  --amber: #f59e0b;
  --red: #ef4444;
  --green: #22c55e;
  --border: #e2e8f0;
  --surface: #f8fafc;
  --text: #0f172a;
  --muted: #64748b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',sans-serif;font-size:14px;color:var(--text);background:var(--surface);display:flex;min-height:100vh}

/* Sidebar */
#sidebar{width:var(--sidebar-w);background:var(--sidebar-bg);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:200;transition:transform .25s}
.sb-brand{padding:18px 20px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.sb-logo{display:flex;align-items:center;gap:9px}
.sb-logo-mark{width:30px;height:30px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px}
.sb-brand-name{color:#f1f5f9;font-weight:600;font-size:14px;letter-spacing:-.2px}
.sb-brand-sub{color:#475569;font-size:10.5px;margin-top:1px}
.sb-nav{flex:1;padding:10px 0;overflow-y:auto}
.sb-section{color:#475569;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:14px 20px 5px}
.sb-link{display:flex;align-items:center;gap:10px;padding:9px 20px;color:#94a3b8;text-decoration:none;font-size:13px;font-weight:500;border-left:3px solid transparent;transition:all .15s;cursor:pointer;background:none;border-top:none;border-right:none;border-bottom:none;width:100%;text-align:left}
.sb-link:hover{color:#e2e8f0;background:rgba(255,255,255,.04)}
.sb-link.active{color:#fff;background:rgba(13,148,136,.18);border-left-color:var(--accent)}
.sb-link i{font-size:15px;opacity:.8;width:18px}
.sb-footer{padding:14px 20px;border-top:1px solid rgba(255,255,255,.07)}
.user-row{display:flex;align-items:center;gap:10px}
.user-av{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.user-nm{color:#e2e8f0;font-size:13px;font-weight:500;line-height:1.2}
.user-rl{color:#475569;font-size:11px}
.sb-logout{background:none;border:none;color:#475569;font-size:12px;cursor:pointer;padding:6px 0 0;font-family:inherit;display:flex;align-items:center;gap:5px}
.sb-logout:hover{color:#ef4444}

/* Main */
#main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{height:54px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:100}
.tb-title{font-size:15px;font-weight:600;color:var(--text)}
.tb-right{display:flex;align-items:center;gap:12px}
.tb-icon-btn{background:none;border:1px solid var(--border);border-radius:7px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;position:relative;transition:all .15s}
.tb-icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.notif-badge{position:absolute;top:-3px;right:-3px;width:8px;height:8px;background:var(--red);border-radius:50%;border:2px solid #fff}
#content{padding:22px 26px;flex:1}

/* Cards */
.card{background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card-header-bar{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:13px;font-weight:600}
.card-body-pad{padding:18px}

/* KPI */
.kpi{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px 20px;box-shadow:0 1px 3px rgba(0,0,0,.06);position:relative;overflow:hidden}
.kpi-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi-val{font-size:26px;font-weight:600;font-family:'IBM Plex Mono',monospace;letter-spacing:-1px;margin:5px 0 3px}
.kpi-sub{font-size:12px;font-weight:500}
.kpi-sub.up{color:var(--green)} .kpi-sub.dn{color:var(--red)} .kpi-sub.neu{color:var(--muted)}
.kpi-icon{position:absolute;right:16px;top:16px;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.ic-teal{background:#ccfbf1;color:#0f766e}
.ic-amber{background:#fef3c7;color:#92400e}
.ic-red{background:#fee2e2;color:#991b1b}
.ic-purple{background:#ede9fe;color:#6d28d9}
.ic-green{background:#dcfce7;color:#166534}

/* Table */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr:hover td{background:#f8fafc}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.b-active{background:#dcfce7;color:#166534}
.b-vacant{background:#fef3c7;color:#92400e}
.b-arrears{background:#fee2e2;color:#991b1b}
.b-open{background:#e0f2fe;color:#075985}
.b-progress{background:#fef9c3;color:#854d0e}
.b-resolved{background:#dcfce7;color:#166534}
.b-closed{background:#f1f5f9;color:#475569}
.b-emergency{background:#4c0519;color:#fda4af}
.b-high{background:#fee2e2;color:#991b1b}
.b-medium{background:#fef3c7;color:#92400e}
.b-low{background:#f0fdf4;color:#166534}

/* Buttons */
.btn-acc{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:background .15s;display:inline-flex;align-items:center;gap:6px}
.btn-acc:hover{background:var(--accent-dark)}
.btn-out{background:#fff;color:var(--text);border:1px solid var(--border);padding:7px 14px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-out:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-danger{background:#fee2e2;color:#991b1b;border:none;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s}
.btn-danger:hover{background:#fecaca}

/* Progress */
.occ-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:4px}
.occ-fill{height:100%;border-radius:3px;background:var(--accent);transition:width .8s ease}
.occ-fill.warn{background:var(--amber)}
.occ-fill.low{background:var(--red)}

/* Tabs */
.page-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:20px}
.p-tab{padding:10px 18px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
.p-tab:hover{color:var(--text)}
.p-tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* Toast */
.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast-item{background:#1e293b;color:#f8fafc;padding:11px 16px;border-radius:8px;font-size:13px;font-weight:500;border-left:4px solid var(--accent);box-shadow:0 4px 12px rgba(0,0,0,.2);animation:slideUp .25s ease;max-width:320px}
.toast-item.err{border-left-color:var(--red)}
.toast-item.warn{border-left-color:var(--amber)}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Modal */
.modal-backdrop-custom{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:#fff;border-radius:12px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.15);animation:modalIn .2s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.modal-hd{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-hd h5{font-size:15px;font-weight:600}
.modal-bd{padding:22px}
.modal-ft{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.close-btn{background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);line-height:1}
.form-grp{margin-bottom:16px}
.form-lbl{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:5px}
.form-inp{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:7px;font-size:13.5px;font-family:inherit;transition:border-color .15s;outline:none}
.form-inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(13,148,136,.12)}
select.form-inp{cursor:pointer}

/* Loader */
.page-loader{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--muted);gap:12px;font-size:13px}
.spin{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Chart area */
.chart-wrap{position:relative;width:100%;height:260px}

/* Arrears alert bar */
.alert-bar{background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:12px 16px;display:flex;align-items:center;gap:10px;margin-bottom:18px;font-size:13px}
.alert-bar i{color:#f97316;font-size:16px;flex-shrink:0}

/* Responsive */
@media(max-width:768px){
  #sidebar{transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
  #main{margin-left:0}
  #content{padding:14px}
  .grid-4{grid-template-columns:1fr 1fr!important}
}
</style>
</head>
<body>

<!-- ══ SIDEBAR ══ -->
<nav id="sidebar">
  <div class="sb-brand">
    <div class="sb-logo">
      <div class="sb-logo-mark">ZP</div>
      <div>
        <div class="sb-brand-name">ZambiaPMS</div>
        <div class="sb-brand-sub">Property Management</div>
      </div>
    </div>
  </div>

  <div class="sb-nav">
    <div class="sb-section">Overview</div>
    <button class="sb-link active" onclick="navigate('dashboard')">
      <i class="bi bi-grid-1x2"></i> Dashboard
    </button>

    <div class="sb-section">Management</div>
    <button class="sb-link" onclick="navigate('properties')">
      <i class="bi bi-buildings"></i> Properties
    </button>
    <button class="sb-link" onclick="navigate('tenants')">
      <i class="bi bi-people"></i> Tenants
    </button>
    <button class="sb-link" onclick="navigate('payments')">
      <i class="bi bi-credit-card"></i> Payments
    </button>
    <button class="sb-link" onclick="navigate('maintenance')">
      <i class="bi bi-tools"></i> Maintenance
    </button>

    <div class="sb-section">Analytics</div>
    <button class="sb-link" onclick="navigate('reports')">
      <i class="bi bi-bar-chart-line"></i> Reports
    </button>
    <button class="sb-link" onclick="navigate('utilities')">
      <i class="bi bi-lightning-charge"></i> Utilities
    </button>
  </div>

  <div class="sb-footer">
    <div class="user-row">
      <div class="user-av" id="userAv">JM</div>
      <div style="flex:1;min-width:0">
        <div class="user-nm" id="userName">James Mwale</div>
        <div class="user-rl" id="userRole">Landlord</div>
      </div>
    </div>
    <button class="sb-logout" onclick="handleLogout()">
      <i class="bi bi-box-arrow-left"></i> Sign out
    </button>
  </div>
</nav>

<!-- ══ MAIN ══ -->
<div id="main">
  <header class="topbar">
    <div class="tb-title" id="pageTitle">Dashboard</div>
    <div class="tb-right">
      <button class="tb-icon-btn" onclick="navigate('notifications')" title="Notifications">
        <i class="bi bi-bell"></i>
        <span class="notif-badge" id="notifDot" style="display:none"></span>
      </button>
      <button class="tb-icon-btn" title="Settings"><i class="bi bi-gear"></i></button>
    </div>
  </header>

  <div id="content">
    <div class="page-loader"><div class="spin"></div> Loading…</div>
  </div>
</div>

<!-- ══ TOAST ══ -->
<div class="toast-wrap" id="toastWrap"></div>

<!-- ══ MODAL ══ -->
<div id="modalWrap" style="display:none"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
// ── Mock data (replaces real API calls for demo) ──────────────────────────
const MOCK = {
  dashboard: {
    portfolio: { total_properties:4, total_units:24, occupied_units:21, vacant_units:3, portfolio_occupancy_rate:87.5 },
    this_month_revenue: '42500.00',
    arrears_count: 3,
    arrears_total: '8750.00',
    unread_notifications: 5,
  },
  properties: [
    { id:'1', name:'Kabulonga Heights', city:'Lusaka', district:'Kabulonga', property_type:'residential', total_units:8, occupied_units:7, occupancy_rate:87.5 },
    { id:'2', name:'Cairo Road Commercial', city:'Lusaka', district:'Central', property_type:'commercial', total_units:6, occupied_units:6, occupancy_rate:100 },
    { id:'3', name:'Woodlands Block B', city:'Lusaka', district:'Woodlands', property_type:'residential', total_units:6, occupied_units:5, occupancy_rate:83.3 },
    { id:'4', name:'Chilenje Flats', city:'Lusaka', district:'Chilenje', property_type:'residential', total_units:4, occupied_units:3, occupancy_rate:75 },
  ],
  tenants: [
    { id:'1', name:'Chanda Mutale', phone:'+260 97 123 4567', unit:'A1', property:'Kabulonga Heights', lease_status:'active', balance:'0.00', nrc:'123456/10/1' },
    { id:'2', name:'Mwansa Kapambwe', phone:'+260 96 234 5678', unit:'B2', property:'Woodlands Block B', lease_status:'active', balance:'2500.00', nrc:'234567/11/1' },
    { id:'3', name:'Bwalya Nkonde', phone:'+260 95 345 6789', unit:'C3', property:'Chilenje Flats', lease_status:'active', balance:'3750.00', nrc:'345678/09/1' },
    { id:'4', name:'Mutinta Phiri', phone:'+260 97 456 7890', unit:'A3', property:'Kabulonga Heights', lease_status:'active', balance:'0.00', nrc:'456789/12/1' },
    { id:'5', name:'Kapesh Banda', phone:'+260 96 567 8901', unit:'D1', property:'Chilenje Flats', lease_status:'active', balance:'2500.00', nrc:'567890/10/1' },
  ],
  payments: [
    { id:'1', tenant:'Chanda Mutale', unit:'A1', property:'Kabulonga Heights', amount:'3500.00', method:'Mobile Money', method_key:'mobile_money', date:'2025-03-01', reference:'MTN-89231', status:'confirmed', balance_after:'0.00' },
    { id:'2', tenant:'Mutinta Phiri', unit:'A3', property:'Kabulonga Heights', amount:'3500.00', method:'Bank Transfer', method_key:'bank_transfer', date:'2025-03-03', reference:'ZNB-12034', status:'confirmed', balance_after:'0.00' },
    { id:'3', tenant:'Mwansa Kapambwe', unit:'B2', property:'Woodlands Block B', amount:'1500.00', method:'Cash', method_key:'cash', date:'2025-03-05', reference:'', status:'confirmed', balance_after:'2500.00' },
    { id:'4', tenant:'Bwalya Nkonde', unit:'C3', property:'Chilenje Flats', amount:'750.00', method:'Mobile Money', method_key:'mobile_money', date:'2025-02-28', reference:'AIR-44521', status:'confirmed', balance_after:'3750.00' },
    { id:'5', tenant:'Kapesh Banda', unit:'D1', property:'Chilenje Flats', amount:'2500.00', method:'Cash', method_key:'cash', date:'2025-02-25', reference:'', status:'confirmed', balance_after:'2500.00' },
  ],
  maintenance: [
    { id:'1', title:'Burst water pipe in kitchen', tenant:'Chanda Mutale', unit:'A1', property:'Kabulonga Heights', priority:'emergency', status:'in_progress', created:'2025-03-10', assigned:'Kalinda Plumbing' },
    { id:'2', title:'Broken window latch', tenant:'Mwansa Kapambwe', unit:'B2', property:'Woodlands Block B', priority:'low', status:'open', created:'2025-03-08', assigned:'' },
    { id:'3', title:'Ceiling fan not working', tenant:'Bwalya Nkonde', unit:'C3', property:'Chilenje Flats', priority:'medium', status:'open', created:'2025-03-07', assigned:'' },
    { id:'4', title:'Electrical socket sparking', tenant:'Mutinta Phiri', unit:'A3', property:'Kabulonga Heights', priority:'high', status:'resolved', created:'2025-03-01', assigned:'Copperbelt Electricals' },
    { id:'5', title:'Leaking roof during rain', tenant:'Kapesh Banda', unit:'D1', property:'Chilenje Flats', priority:'high', status:'in_progress', created:'2025-02-28', assigned:'Lusaka Roofing Co.' },
  ],
  monthly_revenue: [
    { month:'Oct 2024', amount:38200 }, { month:'Nov 2024', amount:40100 },
    { month:'Dec 2024', amount:39500 }, { month:'Jan 2025', amount:41000 },
    { month:'Feb 2025', amount:39800 }, { month:'Mar 2025', amount:42500 },
  ],
  utility_bills: [
    { id:'1', property:'Kabulonga Heights', type:'Electricity (ZESCO)', total:'1240.00', period:'March 2025', split:'equal', status:'split', units_split:8 },
    { id:'2', property:'Chilenje Flats', type:'Water (LWSC)', total:'420.00', period:'March 2025', split:'by_area', status:'pending', units_split:0 },
    { id:'3', property:'Woodlands Block B', type:'Garbage Collection', total:'180.00', period:'March 2025', split:'equal', status:'split', units_split:6 },
  ],
};

// ── Routing ───────────────────────────────────────────────────────────────
const pages = { title: { dashboard:'Dashboard', properties:'Properties & Units', tenants:'Tenants & Leases', payments:'Payments', maintenance:'Maintenance Requests', reports:'Reports & Analytics', utilities:'Utility Billing', notifications:'Notifications' } };
let currentPage = 'dashboard';

function navigate(page) {
  currentPage = page;
  document.getElementById('pageTitle').textContent = pages.title[page] || page;
  document.querySelectorAll('.sb-link').forEach(l => l.classList.remove('active'));
  document.querySelectorAll('.sb-link').forEach(l => {
    if (l.textContent.trim().toLowerCase().includes(page.replace('_',' '))) l.classList.add('active');
  });
  const fn = window[`render_${page}`];
  if (fn) fn();
  else document.getElementById('content').innerHTML = `<div class="page-loader">Page coming soon</div>`;
}

// ── Toast ─────────────────────────────────────────────────────────────────
function toast(msg, type='ok') {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = `toast-item${type==='err'?' err':type==='warn'?' warn':''}`;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 3500);
}

// ── Modal ─────────────────────────────────────────────────────────────────
function openModal(html) {
  const w = document.getElementById('modalWrap');
  w.style.display = 'flex';
  w.className = 'modal-backdrop-custom';
  w.innerHTML = html;
  w.onclick = (e) => { if(e.target===w) closeModal(); };
}
function closeModal() {
  const w = document.getElementById('modalWrap');
  w.style.display = 'none';
  w.innerHTML = '';
}

// ── Helpers ───────────────────────────────────────────────────────────────
function zmw(n) { return `ZMW ${parseFloat(n).toLocaleString('en-ZM',{minimumFractionDigits:2,maximumFractionDigits:2})}`; }
function badge(cls,txt) { return `<span class="badge ${cls}">${txt}</span>`; }
function priorityBadge(p) {
  const m = {emergency:'b-emergency Emergency',high:'b-high High',medium:'b-medium Medium',low:'b-low Low'};
  const [c,t]=(m[p]||'b-low Low').split(' '); return badge(c,t);
}
function statusBadge(s) {
  const m = {active:'b-active Active',open:'b-open Open',in_progress:'b-progress In Progress',resolved:'b-resolved Resolved',closed:'b-closed Closed',vacant:'b-vacant Vacant',confirmed:'b-active Confirmed',split:'b-active Split',pending:'b-open Pending'};
  const v=m[s]||'b-closed '+s;
  const sp=v.indexOf(' '); return badge(v.slice(0,sp),v.slice(sp+1));
}

// ── Auth helpers (demo) ───────────────────────────────────────────────────
function handleLogout() {
  toast('Signed out successfully.','ok');
  setTimeout(()=>{ document.getElementById('content').innerHTML=`<div class="page-loader"><div class="spin"></div>Redirecting to login…</div>`; },1000);
}

// ══════════════════════════════════════════════════════════════════════════
// PAGE: DASHBOARD
// ══════════════════════════════════════════════════════════════════════════
function render_dashboard() {
  const c = document.getElementById('content');
  const d = MOCK.dashboard;

  c.innerHTML = `
  <div class="alert-bar" style="${d.arrears_count>0?'':'display:none'}">
    <i class="bi bi-exclamation-triangle-fill"></i>
    <div><strong>${d.arrears_count} tenant(s)</strong> are in arrears totalling ${zmw(d.arrears_total)}. <a href="#" onclick="navigate('reports');return false" style="color:#f97316;font-weight:600">View arrears report →</a></div>

      </div>

    </div>
  </div>`);
}

function submitPayment() {
  const leaseId = document.getElementById('m_lease').value;
  const amount  = parseFloat(document.getElementById('m_amount').value);
  if (!leaseId) { toast('Please select a tenant','err'); return; }
  if (!amount || amount <= 0) { toast('Enter a valid amount','err'); return; }
  const tenant = MOCK.tenants.find(t=>t.id===leaseId);
  if (tenant) {
    const prev = parseFloat(tenant.balance);
    tenant.balance = Math.max(0, prev - amount).toFixed(2);
    MOCK.payments.unshift({ id:Date.now()+'', tenant:tenant.name, unit:tenant.unit, property:tenant.property, amount:amount.toFixed(2), method:document.getElementById('m_method').selectedOptions[0].text, method_key:document.getElementById('m_method').value, date:document.getElementById('m_pdate').value, reference:document.getElementById('m_ref').value, status:'confirmed', balance_after:tenant.balance });
  }
  closeModal();
  toast(`Payment of ${zmw(amount)} recorded successfully.`,'ok');
  render_payments();
}

    <div style="overflow-x:auto">
      <table class="tbl">
        <thead><tr><th>Issue</th><th>Tenant</th><th>Unit</th><th>Priority</th><th>Status</th><th>Assigned To</th><th>Reported</th><th></th></tr></thead>
        <tbody>
          ${MOCK.maintenance.map(m=>`<tr>
            <td style="max-width:200px">
              <div style="font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${m.title}</div>
              <div style="font-size:11px;color:var(--muted)">${m.property}</div>
            </td>
            <td>${m.tenant}</td>
            <td>${m.unit}</td>
            <td>${priorityBadge(m.priority)}</td>
            <td>${statusBadge(m.status)}</td>
            <td style="font-size:12px;color:var(--muted)">${m.assigned||'Unassigned'}</td>
            <td style="font-size:12px;color:var(--muted);white-space:nowrap">${m.created}</td>
            <td>
              ${m.status!=='resolved'?`<button class="btn-acc btn-sm" onclick="resolveRequest('${m.id}','${m.title.replace(/'/g,"\\'")}')">Resolve</button>`:`<span style="color:var(--muted);font-size:12px">Done</span>`}
            </td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

function resolveRequest(id, title) {
  openModal(`
  <div class="modal-box">
    <div class="modal-hd"><h5>Resolve Request</h5><button class="close-btn" onclick="closeModal()">&times;</button></div>
    <div class="modal-bd">
      <div style="font-size:13px;color:var(--muted);margin-bottom:14px">Resolving: <strong>${title}</strong></div>
      <div class="form-grp"><label class="form-lbl">Resolution Notes</label>
        <textarea class="form-inp" id="m_notes" rows="3" placeholder="Describe what was done and by whom…" style="resize:vertical"></textarea>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-grp"><label class="form-lbl">Contractor</label><input class="form-inp" id="m_contractor" placeholder="Contractor name"></div>
        <div class="form-grp"><label class="form-lbl">Actual Cost (ZMW)</label><input class="form-inp" id="m_cost" type="number" placeholder="0.00"></div>
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn-out" onclick="closeModal()">Cancel</button>
      <button class="btn-acc" onclick="confirmResolve('${id}')"><i class="bi bi-check-lg"></i> Mark Resolved</button>
    </div>
  </div>`);
}

function confirmResolve(id) {
  const req = MOCK.maintenance.find(m=>m.id===id);
  if (req) req.status = 'resolved';
  closeModal();
  toast('Maintenance request marked as resolved.','ok');
  render_maintenance();
}

// ══════════════════════════════════════════════════════════════════════════
// PAGE: REPORTS
// ══════════════════════════════════════════════════════════════════════════
function render_reports() {
  const c = document.getElementById('content');
  c.innerHTML = `
  <div style="font-size:18px;font-weight:600;margin-bottom:18px">Reports & Analytics</div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
    <div class="card">
      <div class="card-header-bar"><span class="card-title">Revenue Trend (6 months)</span></div>
      <div class="card-body-pad"><div class="chart-wrap"><canvas id="lineChart"></canvas></div></div>
    </div>
    <div class="card">
      <div class="card-header-bar"><span class="card-title">Payment Methods Distribution</span></div>
      <div class="card-body-pad"><div class="chart-wrap" style="height:220px"><canvas id="pieChart"></canvas></div></div>
    </div>
  </div>

  <div class="card">
    <div class="card-header-bar">
      <span class="card-title" style="color:#991b1b"><i class="bi bi-exclamation-triangle" style="color:#ef4444;margin-right:6px"></i>Arrears Report</span>
      <span style="font-size:12px;color:var(--muted)">Tenants with outstanding balances</span>
    </div>
    <div style="overflow-x:auto">
      <table class="tbl">
        <thead><tr><th>Tenant</th><th>Phone</th><th>Unit</th><th>Property</th><th>Monthly Rent</th><th>Balance Due</th><th>Status</th></tr></thead>
        <tbody>
          ${MOCK.tenants.filter(t=>parseFloat(t.balance)>0).map(t=>`<tr>
            <td style="font-weight:500">${t.name}</td>
            <td style="font-size:12px;color:var(--muted)">${t.phone}</td>

            <td style="font-size:12px;color:var(--muted)">${t.property}</td>
            <td style="font-family:'IBM Plex Mono',monospace">ZMW 3,500.00</td>
            <td style="font-family:'IBM Plex Mono',monospace;color:#ef4444;font-weight:600">${zmw(t.balance)}</td>
            <td>${badge('b-arrears','In Arrears')}</td>
          </tr>`).join('')}
        </tbody>
        <tfoot>
          <tr style="background:var(--surface)">
            <td colspan="5" style="font-weight:600;padding:11px 14px">Total Outstanding</td>
            <td style="font-family:'IBM Plex Mono',monospace;font-weight:700;color:#ef4444;padding:11px 14px">${zmw(MOCK.tenants.filter(t=>parseFloat(t.balance)>0).reduce((s,t)=>s+parseFloat(t.balance),0))}</td>
            <td></td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>`;

  setTimeout(()=>{
    const months = MOCK.monthly_revenue.map(m=>m.month);
    const amounts = MOCK.monthly_revenue.map(m=>m.amount);

    new Chart(document.getElementById('lineChart').getContext('2d'),{
      type:'line',
      data:{labels:months,datasets:[{label:'Revenue',data:amounts,borderColor:'#0d9488',backgroundColor:'rgba(13,148,136,0.08)',borderWidth:2,pointBackgroundColor:'#0d9488',pointRadius:4,tension:.35,fill:true}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{grid:{color:'#f1f5f9'},ticks:{callback:v=>`${(v/1000).toFixed(0)}K`,font:{size:11}}},x:{grid:{display:false},ticks:{font:{size:11}}}}}
    });

    const methods = {Cash:2, 'Mobile Money':2, 'Bank Transfer':1};
    new Chart(document.getElementById('pieChart').getContext('2d'),{
      type:'doughnut',
      data:{labels:Object.keys(methods),datasets:[{data:Object.values(methods),backgroundColor:['#0d9488','#f59e0b','#6366f1'],borderWidth:0}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:12},padding:16}}},cutout:'65%'}
    });
  },50);
}

// PAGE: UTILITIES
// ══════════════════════════════════════════════════════════════════════════
function render_utilities() {
  const c = document.getElementById('content');
  c.innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
    <div>
      <div style="font-size:18px;font-weight:600">Utility Billing</div>
      <div style="font-size:13px;color:var(--muted);margin-top:2px">ZESCO · LWSC · Garbage — auto-split by unit</div>
    </div>
    <button class="btn-acc" onclick="toast('Create utility bill form coming soon','warn')"><i class="bi bi-plus-lg"></i> Add Bill</button>
  </div>
  <div class="card">
    <div style="overflow-x:auto">
      <table class="tbl">
        <thead><tr><th>Property</th><th>Utility</th><th>Total Amount</th><th>Split Method</th><th>Period</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${MOCK.utility_bills.map(b=>`<tr>
            <td style="font-weight:500">${b.property}</td>
            <td>${b.type}</td>
            <td style="font-family:'IBM Plex Mono',monospace;font-weight:600">${zmw(b.total)}</td>
            <td style="font-size:12px">${b.split==='equal'?'Equal split':b.split==='by_area'?'By floor area':'By occupants'}</td>
            <td style="font-size:12px;color:var(--muted)">${b.period}</td>
            <td>${statusBadge(b.status)}</td>
            <td>
              ${b.status==='pending'?`<button class="btn-acc btn-sm" onclick="runSplit('${b.id}','${b.property}')"><i class="bi bi-lightning"></i> Split</button>`:`<span style="font-size:12px;color:var(--muted)">${b.units_split} units</span>`}
            </td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>

  <div style="margin-top:16px" class="card">
    <div class="card-header-bar"><span class="card-title">How the auto-split algorithm works</span></div>
    <div class="card-body-pad">
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">
        ${[
          ['Equal Split','bi-distribute-vertical','Total bill ÷ number of occupied units. Simplest and most common. Rounding goes to the first unit.','#ccfbf1','#0f766e'],
          ['By Floor Area','bi-rulers','Each unit pays proportionally to its floor area in m². Fairer for mixed-size properties.','#fef3c7','#92400e'],
          ['By Occupants','bi-people','Each unit pays based on the number of people on the lease. Fairest for water billing.','#ede9fe','#6d28d9'],
        ].map(([t,ic,desc,bg,tc])=>`
          <div style="background:${bg};border-radius:8px;padding:16px">
            <i class="bi ${ic}" style="font-size:20px;color:${tc};margin-bottom:8px;display:block"></i>
            <div style="font-weight:600;font-size:13px;color:${tc};margin-bottom:6px">${t}</div>
            <div style="font-size:12px;color:${tc};opacity:.8;line-height:1.5">${desc}</div>
          </div>`).join('')}
      </div>
    </div>
  </div>`;
}

function runSplit(id, property) {
  const bill = MOCK.utility_bills.find(b=>b.id===id);
  if (bill) { bill.status='split'; bill.units_split=4; }
  toast(`Bill for ${property} has been split across units.`,'ok');
  render_utilities();
}
