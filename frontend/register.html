<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZambiaPMS — Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'IBM Plex Sans', sans-serif;
      min-height: 100vh;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }
    .register-card {
      max-width: 480px;
      width: 100%;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 35px -10px rgba(0,0,0,0.1);
      padding: 32px 28px;
    }
    .logo { width: 48px; height: 48px; background: #0d9488; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 20px; margin-bottom: 24px; }
    h2 { font-size: 24px; font-weight: 600; margin-bottom: 6px; }
    .subtitle { color: #64748b; font-size: 14px; margin-bottom: 28px; }
    .form-group { margin-bottom: 18px; }
    .form-label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: #64748b; display: block; margin-bottom: 5px; }
    .form-input {
      width: 100%; padding: 10px 12px; border: 1.5px solid #e2e8f0; border-radius: 8px;
      font-size: 14px; font-family: inherit; transition: border-color .15s;
    }
    .form-input:focus { border-color: #0d9488; outline: none; box-shadow: 0 0 0 3px rgba(13,148,136,.12); }
    .btn-submit {
      width: 100%; background: #0d9488; color: #fff; border: none; border-radius: 8px;
      padding: 12px; font-weight: 600; font-size: 14px; cursor: pointer; margin-top: 8px;
    }
    .btn-submit:hover { background: #0f766e; }
    .error-msg { background: #fef2f2; border: 1px solid #fecaca; border-radius: 7px; padding: 10px 14px; font-size: 13px; color: #dc2626; margin-bottom: 16px; display: none; align-items: center; gap: 8px; }
    .success-msg { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 7px; padding: 10px 14px; font-size: 13px; color: #15803d; margin-bottom: 16px; display: none; }
    .footer { margin-top: 24px; text-align: center; font-size: 13px; color: #64748b; }
    .footer a { color: #0d9488; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
<div class="register-card">
  <div class="logo">ZP</div>
  <h2>Create an account</h2>
  <div class="subtitle">Start managing properties in Zambia</div>
  <div id="errorMsg" class="error-msg"><i class="bi bi-exclamation-circle-fill"></i><span></span></div>
  <div id="successMsg" class="success-msg"><i class="bi bi-check-circle-fill"></i><span>Registration successful! Redirecting to login...</span></div>
  <form id="registerForm">
    <div class="form-group"><label class="form-label">Full Name</label><input class="form-input" id="fullName" required></div>
    <div class="form-group"><label class="form-label">Email Address</label><input class="form-input" id="email" type="email" required></div>
    <div class="form-group"><label class="form-label">Phone Number</label><input class="form-input" id="phone" required></div>
    <div class="form-group"><label class="form-label">Role</label>
      <select class="form-input" id="role">
        <option value="landlord">Landlord</option>
        <option value="tenant">Tenant</option>
      </select>
    </div>
    <div class="form-group"><label class="form-label">Password</label><input class="form-input" id="password" type="password" required></div>
    <div class="form-group"><label class="form-label">Confirm Password</label><input class="form-input" id="confirmPassword" type="password" required></div>
    <button class="btn-submit" type="submit">Register</button>
  </form>
  <div class="footer">Already have an account? <a href="login.html">Sign in</a></div>
</div>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script>
  const form = document.getElementById('registerForm');
  const errorDiv = document.getElementById('errorMsg');
  const successDiv = document.getElementById('successMsg');
  
  function showError(msg) { 
      errorDiv.style.display = 'flex'; 
      errorDiv.querySelector('span').textContent = msg; 
  }
  function hideError() { 
      errorDiv.style.display = 'none'; 
  }
  
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();
    successDiv.style.display = 'none';
    
    // Split full name into first and last name for Django Models
    const fullName = document.getElementById('fullName').value.trim();
    const nameParts = fullName.split(' ');
    const firstName = nameParts[0] || '';
    const lastName = nameParts.slice(1).join(' ') || '';
    
    // Grab passwords
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    // Local validation for matching passwords
    if (password !== confirmPassword) {
        showError('Passwords do not match.');
        return;
    }

    // Build payload matching serializers.py perfectly
    const data = {
      first_name: firstName,
      last_name: lastName,
      email: document.getElementById('email').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      role: document.getElementById('role').value,
      password: password,
      confirm_password: confirmPassword
    };

    if (!firstName || !data.email || !data.phone || !data.password) {
      showError('Please fill all required fields.');
      return;
    }
    
    try {
      await api.auth.register(data);
      successDiv.style.display = 'block';
      setTimeout(() => { window.location.href = 'login.html'; }, 1500);
    } catch (err) {
      // Show validation errors cleanly
      showError(err.message || 'Registration failed. Please try again.');
    }
  });
</script>
</body>
</html>
